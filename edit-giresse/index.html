<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GIRESSE — edit</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/gsap.min.js"></script>
    <script src="js/temps.js"></script>
    <script src="js/main.js"></script>
  </head>
  <body>
    <div id="racine" data-composition-id="main" data-start="0" data-duration="23.7" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="23.7" data-track-index="0">
        <div id="monde">
          <div class="lueur" id="lueur"></div>
          <div id="essaim"></div>
          <div id="plans"></div>
          <div id="heros">
            <div class="h-fond"></div><div class="h-halo"></div>
            <div class="h-nav"><b>Giresse</b><span>Travaux</span><span>Studio</span><span>Contact</span></div>
            <div class="h-titre">Des idées<br />qui bougent.</div>
            <div class="h-sous">Sites · montage · motion design</div>
            <div class="h-bouton">Voir les projets</div>
            <div class="h-carte"></div>
          </div>
        </div>
        <div id="mot" class="mot"></div>
        <div id="phrase" class="phrase"></div>
        <img id="fin-logo" class="fin-logo" src="assets/logo-slsd.jpg" alt="SLSD" />
        <div id="fin-nom" class="fin-nom">Giresse</div>
        <div id="fin-sous" class="fin-sous">DEV · MONTAGE · MOTION</div>
        <div id="flash"></div>
        <svg class="grain" width="1080" height="1920"><filter id="bruit"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" /></filter><rect width="100%" height="100%" filter="url(#bruit)" /></svg>
        <div class="vignette"></div>
      </section>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="23.7" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.CONSTRUIRE(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
