<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>JP Service — Parking à Akwa</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/gsap.min.js"></script>
    <script src="js/temps.js"></script>
    <script src="js/main.js"></script>
  </head>
  <body>
    <div id="racine" data-composition-id="main" data-start="0" data-duration="15" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="15" data-track-index="0">
        <div id="camera" class="couche">
          <!-- HOOK : STOP. sur rouge qui flashe -->
          <div id="hook" class="couche">
            <div id="hook-fond" class="couche"></div>
            <div id="stop" class="stop">STOP.</div>
          </div>
          <div id="titre" class="titre">
            <div class="ligne rouge">20&nbsp;MIN</div><div class="ligne">POUR UN</div><div class="ligne">PARKING&nbsp;?</div>
          </div>

          <!-- CARTE : vue de dessus, la voiture tourne en rond -->
          <div id="carte-zone" class="couche">
            <div id="carte" class="carte">
              <svg id="plan" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
            </div>
            <div id="chrono-boite" class="chrono-boite">
              <div class="etiquette">À LA RECHERCHE D'UNE PLACE</div>
              <div id="chrono" class="chrono">00:00</div>
            </div>
          </div>
          <div id="fige" class="couche fige"><div class="cadre"></div></div>

          <!-- CALME : la voiture s'arrête pile devant la porte -->
          <div id="calme" class="couche">
            <svg id="rue" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
            <div id="t-descendez" class="accroche">Descendez.</div>
            <div id="t-ongere" class="accroche petite">On gère<span class="point">.</span></div>
          </div>

          <!-- FIN : logo, prix, WhatsApp -->
          <div id="fin" class="couche">
            <div class="fin-fond couche"></div>
            <img id="logo" class="logo" src="assets/logo.png" alt="JP Service Express Urbaine" />
            <div id="sous-logo" class="sous-logo">CHAUFFEUR PRIVÉ · DOUALA</div>
            <div id="prix" class="prix"><div class="des">Dès</div><div class="montant">3&nbsp;000 <span>FCFA/h</span></div></div>
            <div id="cta" class="cta">
              <svg viewBox="0 0 32 32" width="58" height="58"><path fill="#25D366" d="M16 3C9 3 3.4 8.6 3.4 15.5c0 2.4.7 4.7 1.9 6.6L3.5 28.5l6.6-1.7c1.8 1 3.8 1.5 5.9 1.5 7 0 12.6-5.6 12.6-12.6S23 3 16 3zm5.7 15.2c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.6 8.6 0 0 1-4.3-3.7c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.4c.2.2 2.4 3.6 5.7 5 2.1.9 2.9 1 4 .8.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z" /></svg>
              +237 655 394 028
            </div>
          </div>
        </div>

        <!-- RUPTURE : balayage géométrique -->
        <div id="balayage" class="couche balayage"><i></i><i></i><i></i></div>
        <!-- Sous-titres mot par mot (zone sûre TikTok) -->
        <div id="sous-titres" class="sous-titres"></div>
        <div class="grain"></div>
        <div class="vignette"></div>
      </section>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="15" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.CONSTRUIRE(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
