function step(dt,t){for(let i=0;i<13;i++)spawn('f');if(rnd()<.6)spawn('s');if(rnd()<.5)spawn('e');parts.forEach(p=>{p.age+=dt;p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(t*3+p.y*4)*.15)*dt;p.z+=p.vz*dt;if(p.k==='f'){p.x+=(FIRE[0]-p.x)*dt*1.2;p.z+=(FIRE[2]-p.z)*dt*1.2}});parts=parts.filter(p=>p.age<p.life)}
function drawParts(kinds,additive){const ps=parts.filter(p=>kinds.includes(p.k));if(!ps.length)return;const P=[],C=[],S=[];
 ps.forEach(p=>{const u=p.age/p.life;P.push(p.x,p.y,p.z);let c;if(p.k==='f'){const col=u<.2?[1,.9,.55]:u<.5?[1,.6,.15]:[.95,.3,.06];c=[...col,(1-u)*.7];S.push(p.s*(1-u*.5)*760)}else if(p.k==='s'){c=[.8,.8,.8,(u<.15?u/.15:1-u)*.3];S.push((p.s+u*1.2)*600)}else{c=[1,.75,.3,1-u];S.push(p.s*700)}C.push(...c)});
 gl.useProgram(partP);const a=k=>gl.getAttribLocation(partP,k);[['p',P,3],['c',C,4],['s',S,1]].forEach(([k,d,n])=>{gl.bindBuffer(gl.ARRAY_BUFFER,pBuf[k]);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(d),gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(a(k));gl.vertexAttribPointer(a(k),n,gl.FLOAT,false,0,0)});
 gl.uniformMatrix4fv(gl.getUniformLocation(partP,'VP'),false,U.VP);gl.uniform1f(gl.getUniformLocation(partP,'K'),U.K);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,additive?gl.ONE:gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);gl.drawArrays(gl.POINTS,0,ps.length);gl.depthMask(true);gl.disable(gl.BLEND);
 ['p','c','s'].forEach(k=>gl.disableVertexAttribArray(a(k)))}
// ---------- frame ----------
function setCam(eye,tgt,fov,vw,vh){U.VP=m4.mul(m4.persp(fov,vw/vh,.1,120),m4.look(eye,tgt,[0,1,0]));U.camP=eye;U.K=vh/(2*Math.tan(fov/2))*0.0011*1}
function skyDraw(t){gl.useProgram(skyP);gl.disable(gl.DEPTH_TEST);const a=gl.getAttribLocation(skyP,'q');gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);gl.uniform1f(gl.getUniformLocation(skyP,'t'),t);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.disableVertexAttribArray(a);gl.enable(gl.DEPTH_TEST)}
function lights(t){U.sunDir=norm([-.5,.8,.6]);U.sunCol=[.95,.92,.86];U.skyC=[.62,.78,.98];U.gndC=[.95,.82,.62];U.fireP=[FIRE[0],FIRE[1]+.45,FIRE[2]];U.fireC=[1.0,.55,.2];U.fireI=1.4+.35*Math.sin(t*17)+.25*Math.sin(t*29+1);U.fogC=[1,.93,.82];U.fogD=.006}
function drawChar(b,armL,armR,o,M,t,talk){drawMesh(b,M);const sL=chain(M,m4.t(-.27,1.06,0),m4.rz(o.aL||-.15),m4.rx(o.fL||0));const sR=chain(M,m4.t(.27,1.06,0),m4.rz(o.aR||.15),m4.rx(o.fR||0));drawMesh(armL,sL);drawMesh(armR,sR);
 const op=talk?Math.max(.15,Math.abs(Math.sin(t*11))*(.6+.4*Math.sin(t*3.1))):0.1;drawMesh(mouth,chain(M,m4.t(0,o.hy-.15,.27),m4.s(1,.3+op*.9,1)),{ol:.008})}
const sentence=["SANS","EFFUSION","DE","SANG,","IL","N'Y","A","PAS","DE","PARDON."];
function frame(t){const dt=1/30;step(dt,t);lights(t);
 // ---- medallion pass (Aurélien bust) ----
 gl.viewport(0,0,W,H);gl.enable(gl.DEPTH_TEST);gl.clearColor(.75,.88,.96,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 setCam([0,1.25,3.4],[0,1.2,0],.5,W,H);skyDraw(t);drawMesh(B.street,m4.id(),{ol:.012});
 const talk=t>.4&&t<5.4;drawChar(B.aur,aurArmL,aurArmR,{...AU,aL:-.25,aR:.9+.15*Math.sin(t*2.2),fR:-.9},chain(m4.ry(.15*Math.sin(t*.8))),t,talk);
 const bust=document.createElement('canvas');bust.width=bust.height=900;bust.getContext('2d').drawImage(glc,(W-900)/2,(H-900)/2-230,900,900,0,0,900,900);
 // ---- main pass ----
 gl.clearColor(1,1,1,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 const k=t/6;const eye=[-.5+.7*k,1.75,9.6-1.1*k],tgt=[.05,1.15,-.6];setCam(eye,tgt,.6,W,H);skyDraw(t);
 drawMesh(B.envNoOl,m4.id(),{noOutline:1});drawMesh(B.env,m4.id(),{noOutline:1});drawMesh(B.tent,m4.id(),{ol:.03});drawMesh(B.fence,m4.id(),{ol:.02});drawMesh(B.altar,m4.id(),{ol:.02});
 const pM=chain(m4.t(-.85,0,.15),m4.ry(.45));drawChar(B.priest,priestArm,priestArm,{...PR,aL:-2.5-.12*Math.sin(t*1.7),aR:2.5+.12*Math.sin(t*1.7),fL:-.3,fR:-.3},pM,t,t>1.5&&t<3.5);
 const br=1+.02*Math.sin(t*3);drawMesh(B.lamb,chain(m4.t(.05,0,.95),m4.ry(-.6),m4.s(1,br,1)));drawMesh(B.lambHead,chain(m4.t(.05,0,.95),m4.ry(-.6),m4.t(.33,.68+.02*Math.sin(t*2),0),m4.rz(.15*Math.sin(t*1.3))));
 drawParts(['s'],false);drawParts(['f','e'],true);
 // ---- compose 2D ----
 o2.drawImage(glc,0,0);
 // warm glow around fire (screen space)
 const fp=proj([FIRE[0],FIRE[1]+.4,FIRE[2]]);const gr=o2.createRadialGradient(fp[0],fp[1],10,fp[0],fp[1],520);gr.addColorStop(0,`rgba(255,170,60,${.32+.08*Math.sin(t*17)})`);gr.addColorStop(1,'rgba(255,170,60,0)');o2.globalCompositeOperation='lighter';o2.fillStyle=gr;o2.fillRect(0,0,W,H);o2.globalCompositeOperation='source-over';
 // vignette
 const vg=o2.createRadialGradient(W/2,H*.45,H*.35,W/2,H*.5,H*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(40,20,10,.28)');o2.fillStyle=vg;o2.fillRect(0,0,W,H);
 // label
 pill('ÉPISODE 2 · LE SANG DES SACRIFICES',170);
 // karaoke subtitles
 const shown=Math.floor(Math.max(0,(t-.4))/0.48)+1;subs(sentence.slice(0,Math.min(shown,sentence.length)),t);
 // medallion
 const X=46,Y=1360,D=350;o2.save();o2.beginPath();o2.arc(X+D/2,Y+D/2,D/2,0,7);o2.clip();o2.drawImage(bust,X,Y,D,D);o2.restore();
 o2.lineWidth=11;o2.strokeStyle='#1d1a1f';o2.beginPath();o2.arc(X+D/2,Y+D/2,D/2,0,7);o2.stroke();o2.lineWidth=6;o2.strokeStyle='#FFD23F';o2.beginPath();o2.arc(X+D/2,Y+D/2,D/2-8,0,7);o2.stroke();
 o2.font='900 28px "Inter Display"';const w=o2.measureText('AURÉLIEN').width;o2.fillStyle='#FFD23F';o2.strokeStyle='#1d1a1f';o2.lineWidth=5;o2.beginPath();o2.roundRect(X+D/2-w/2-20,Y+D-24,w+40,48,24);o2.fill();o2.stroke();o2.fillStyle='#1d1a1f';o2.textAlign='center';o2.fillText('AURÉLIEN',X+D/2,Y+D+10);o2.textAlign='left';}
function proj(p){const v=U.VP;const x=v[0]*p[0]+v[4]*p[1]+v[8]*p[2]+v[12],y=v[1]*p[0]+v[5]*p[1]+v[9]*p[2]+v[13],w=v[3]*p[0]+v[7]*p[1]+v[11]*p[2]+v[15];return [(x/w*.5+.5)*W,(1-(y/w*.5+.5))*H]}
function pill(t,y){o2.font='800 30px Inter';const w=o2.measureText(t).width;o2.fillStyle='#fff';o2.strokeStyle='#1d1a1f';o2.lineWidth=5;o2.beginPath();o2.roundRect(W/2-w/2-26,y-40,w+52,58,29);o2.fill();o2.stroke();o2.fillStyle='#1d1a1f';o2.textAlign='center';o2.fillText(t,W/2,y);o2.textAlign='left'}
function subs(words,t){const lines=[[],[]];words.forEach((w,i)=>lines[i<4?0:1].push([w,i]));o2.font='900 68px "Inter Display"';
 const full=[sentence.slice(0,4),sentence.slice(4)];lines.forEach((ln,li)=>{if(!ln.length)return;const all=full[li];const ws=all.map(w=>o2.measureText(w+' ').width);let X=(W-ws.reduce((a,b)=>a+b)+o2.measureText(' ').width)/2;const y=330+li*92;
  all.forEach((w,j)=>{const idx=li==0?j:j+4;if(idx<words.length){const isNew=idx==words.length-1;const sc=isNew?1+.12*Math.max(0,1-((t-.4)%0.48)/0.2):1;o2.save();o2.translate(X+ws[j]/2,y-26);o2.scale(sc,sc);o2.translate(-(X+ws[j]/2),-(y-26));o2.lineJoin='round';o2.strokeStyle='#1d1a1f';o2.lineWidth=16;o2.strokeText(w,X,y);o2.fillStyle=(w.startsWith('SANG')||w.startsWith('PARDON'))?'#FFD23F':'#fff';o2.fillText(w,X,y);o2.restore()}X+=ws[j]})})}
window.renderAt=(t)=>{frame(t)};
window.warm=(n)=>{for(let i=0;i<n;i++)step(1/30,i/30)};
</script></body></html>
