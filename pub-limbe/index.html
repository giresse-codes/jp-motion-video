<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>JP Service — Samedi à Limbé</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/gsap.min.js"></script>
    <script src="js/temps.js"></script>
    <script src="js/main.js"></script>
  </head>
  <body>
    <div id="racine" data-composition-id="main" data-start="0" data-duration="30" data-fps="30" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="30" data-track-index="0">
        <div id="camera" class="couche">
          <!-- Journée : ciel, soleil, plans illustrés -->
          <div id="journee" class="couche">
            <div id="ciel" class="couche"></div>
            <div class="ciel-voile couche"></div>
            <div id="soleil" class="soleil"></div>
            <div id="plans"></div>
            <div id="horloge" class="horloge"><span class="point"></span><span id="heure">SAM. 07:00</span></div>
            <div id="badge" class="badge">Et le retour&nbsp;?</div>
            <div id="sous-titres"></div>
            <div id="question" class="question"><div>Et le</div><div>retour&nbsp;?</div></div>
            <div id="reponse" class="reponse"><div class="r1">Le retour&nbsp;?</div><div class="r2">Votre chauffeur s'en occupe.</div></div>
            <div id="prix" class="prix">
              <div class="p1">50 000 FCFA <small>/ jour</small></div>
              <div class="p2">3 jours : 100 000 FCFA</div>
              <div class="p3">Carburant à la charge du client</div>
            </div>
          </div>

          <!-- Hook -->
          <div id="hook" class="couche hook-fond">
            <div class="hook">
              <div class="ligne">PERSONNE</div><div class="ligne">N'A ENVIE</div><div class="ligne">DE CONDUIRE</div><div class="ligne grosse">2&nbsp;H…</div>
            </div>
          </div>

          <!-- Fin : retour au début + CTA -->
          <div id="fin" class="couche fin">
            <div class="fin-heure">Samedi 7&nbsp;h.</div>
            <div class="fin-sous">Limbé vous attend. On conduit.</div>
            <div class="bande-logo"><img src="assets/logo.png" alt="JP Service Express Urbaine" /></div>
            <div class="cta">
              <svg viewBox="0 0 32 32" width="56" height="56"><path fill="#fff" d="M16 3C9 3 3.4 8.6 3.4 15.5c0 2.4.7 4.7 1.9 6.6L3.5 28.5l6.6-1.7c1.8 1 3.8 1.5 5.9 1.5 7 0 12.6-5.6 12.6-12.6S23 3 16 3zm5.7 15.2c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.6 8.6 0 0 1-4.3-3.7c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.4c.2.2 2.4 3.6 5.7 5 2.1.9 2.9 1 4 .8.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z" /></svg>
              WhatsApp : +237 655 394 028
            </div>
          </div>
        </div>
        <div id="eclair" class="couche eclair"></div>
        <div class="grain"></div>
      </section>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="30" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.CONSTRUIRE(tl);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
